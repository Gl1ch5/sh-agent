[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sh-agent"
version = "0.2.0"
description = "Super-economical bash-only AI agent with custom Python TUI, OpenRouter pricing tracker, prompt caching, and auto-update"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gl1ch5" }]
dependencies = [
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.43",
]

[project.scripts]
shx = "sh_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sh_agent"]
